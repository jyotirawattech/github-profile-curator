name: profile-curator-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test and run the example
        run: |
          python3 -m unittest discover -s tests -v
          renderer=skills/github-profile-curator/scripts/render_profile.py
          python3 "$renderer" --readme examples/profile.md --projects examples/projects.json --before '## Selected projects' > /tmp/profile-preview.md
          python3 "$renderer" --readme /tmp/profile-preview.md --projects examples/projects.json > /tmp/profile-repeat.md
          cmp /tmp/profile-preview.md /tmp/profile-repeat.md
